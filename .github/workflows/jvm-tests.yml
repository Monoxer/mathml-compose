name: JVM Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  JvmUnitTests:
    name: JvmUnitTests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run JVM unit tests
        run: ./gradlew jvmTest

      - name: Upload JVM test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-results
          path: build/test-results/jvmTest/
          retention-days: 7
