name: Wasm Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  WasmUnitTests:
    name: WasmUnitTests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Wasm unit tests
        run: ./gradlew wasmJsTest

      - name: Upload Wasm test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-results
          path: build/test-results/wasmJsBrowserTest/
          retention-days: 7
